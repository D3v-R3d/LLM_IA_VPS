services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tower_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/tower_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CLOUD_HOST=https://ollama.com
      - OLLAMA_USE_CLOUD=true
      - OLLAMA_API_KEY_FILE=/run/secrets/ollama_api_key
      - GROQ_API_KEY_FILE=/run/secrets/groq_api_key
      - GOOGLE_API_KEY_FILE=/run/secrets/google_api_key
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - LLM_MODEL=${LLM_MODEL:-gemma-4-31b-it}
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - TELEGRAM_BOT_USERNAME_FILE=/run/secrets/telegram_bot_username
      - TELEGRAM_SECRET_TOKEN_FILE=/run/secrets/telegram_secret_token
      - SYNOLOGY_USERNAME_FILE=/run/secrets/synology_username
      - SYNOLOGY_PASSWORD_FILE=/run/secrets/synology_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - PROMPT_DIR=/home/projects/tower_project
      - USE_AGENT_ORCHESTRATOR=true
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
    secrets:
      - openrouter_api_key
      - ollama_api_key
      - groq_api_key
      - google_api_key
      - anthropic_api_key
      - telegram_bot_token
      - telegram_bot_username
      - telegram_secret_token
      - synology_username
      - synology_password
      - jwt_secret
    volumes:
      - ./prompt:/home/projects/tower_project
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tower_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      - postgres
      - qdrant
      - ollama

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.srv1632761.hstgr.cloud`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=backend-ratelimit"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.backend-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tower_frontend
    restart: unless-stopped

    networks:
      - tower_network

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`www.srv1632761.hstgr.cloud`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  postgres:
    image: postgres:15-alpine
    container_name: tower_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_DB=tower_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tower_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: tower_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - tower_network
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'timeout 5 bash -c \"exec 3<>/dev/tcp/127.0.0.1/11434; echo -e \\\"GET /api/tags HTTP/1.1\\\\r\\\\nHost: localhost\\\\r\\\\n\\\\r\\\\n\\\" >&3; head -1 <&3\"'"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tower_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tower_network

secrets:
  ollama_api_key:
    file: ./secrets/ollama_api_key.txt
  groq_api_key:
    file: ./secrets/groq_api_key.txt
  google_api_key:
    file: ./secrets/google_api_key.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_bot_username:
    file: ./secrets/telegram_bot_username.txt
  telegram_secret_token:
    file: ./secrets/telegram_secret_token.txt
  synology_username:
    file: ./secrets/synology_username.txt
  synology_password:
    file: ./secrets/synology_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

networks:
  tower_network:
    driver: bridge