services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tower_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/tower_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=http://ollama:11434

    networks:
      - tower_network

    depends_on:
      - postgres
      - qdrant
      - ollama

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.srv1632761.hstgr.cloud`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tower_frontend
    restart: unless-stopped

    networks:
      - tower_network

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`www.srv1632761.hstgr.cloud`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  postgres:
    image: postgres:15-alpine
    container_name: tower_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tower_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tower_network

  ollama:
    image: ollama/ollama:latest
    container_name: tower_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - tower_network

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tower_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tower_network

  adminer:
    image: adminer:4.8.1
    container_name: tower_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - tower_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`admin.srv1632761.hstgr.cloud`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

networks:
  tower_network:
    driver: bridge